services:
  postgres:
    image: postgres:16-alpine
    container_name: eke-local-postgres
    environment:
      POSTGRES_USER: eke
      POSTGRES_PASSWORD: eke
      POSTGRES_DB: eke
    ports:
      - "5436:5432"
    volumes:
      - eke_local_postgres:/var/lib/postgresql/data

volumes:
  eke_local_postgres:
